[project]
name = "atmos-weather"
version = "1.0.0"
description = "Advanced real-time weather web application"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "httpx>=0.28.0",
    "python-dotenv>=1.1.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.9.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
